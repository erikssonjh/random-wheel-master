<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julkalender!</title>
  <meta name="theme-color" content="#B22222">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon.png">
  <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,700" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="letterhead">
  <div>Dags för julkalenderdragningen <span class="brand">| XLENT</span></div>
</header>

<main>
  <div id="wheel-wrap">
    <canvas id="canvas" aria-label="Lyckohjul"></canvas>
  </div>

  <aside class="panel">
    <div id="lucka-row">
      <button id="lucka-prev" class="small-btn" aria-label="Föregående lucka">&#9664;</button>
      <div id="lucka-label">Lucka</div>
      <button id="lucka-next" class="small-btn" aria-label="Nästa lucka">&#9654;</button>
    </div>
    <div id="lucka-info"></div>

    <button id="spin-wheel" class="big-btn">Snurra!</button>

    <h2>Med i hjulet <span class="hint">(tryck för &rdquo;borta idag&rdquo;)</span></h2>
    <div id="name-list" class="list"></div>

    <h2>Vinnare hittills</h2>
    <div id="winner-list" class="list"></div>

    <div class="add-row">
      <input id="name-input" placeholder="Lägg till gäst…" autocomplete="off">
      <button id="add-name" class="small-btn">+</button>
    </div>
    <button id="reset-winners" class="link-btn">Nollställ alla vinnare</button>
  </aside>
</main>

<div id="overlay" class="hidden" role="dialog" aria-live="assertive">
  <div class="overlay-box">
    <div class="overlay-title">&#127876; Grattis &#127876;</div>
    <div id="overlay-name"></div>
    <div id="overlay-lucka"></div>
    <div class="overlay-buttons">
      <button id="overlay-ok" class="big-btn">OK</button>
      <button id="overlay-respin" class="big-btn secondary">Snurra om</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
